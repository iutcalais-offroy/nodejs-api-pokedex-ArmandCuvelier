openapi: 3.0.0
info:
  title: API Documentation
  version: 1.0.0
  description: Documentation de l'API avec authentification JWT
  contact:
    name: Votre nom
    email: votre@email.com

servers:
  - url: http://localhost:3001
    description: Serveur de développement
  - url: https://api.production.com
    description: Serveur de production

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjksImVtYWlsIjoicmVkQGV4YW1wbGUuY29tIiwiaWF0IjoxNzcwMzg0NDQ4LCJleHAiOjE3NzA5ODkyNDh9.qEPYgvKpKulbWBC-BrhGD3BEwAe_sykU9HxD8ivRojk"

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "red"
        email:
          type: string
          format: email
          example: "red@example.com"

    Error:
      type: object
      properties:
        message:
          type: string
          example: "Message d'erreur"

tags:
  - name: Authentication
    description: Gestion de l'authentification
  - name: Users
    description: Gestion des utilisateurs